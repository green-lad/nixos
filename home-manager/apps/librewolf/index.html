<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>new tab</title>
    <style>
      html {
        min-height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        min-height: 100vh;
        background: #11121d;
        margin: 0;
        * {
          margin: 20px;
          border-radius: 10px;
        }
      }
      input {
        color: white;
        font-size: 30px;
        background: #11121d;
        border: 2px #3b414e solid;
        padding: 10px;
        box-sizing: border-box;
      }
      hr {
        color: #cdd6f4;
      }
      #flex {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        align-items: stretch;
        align-content: stretch;
        flex-grow: 1;
        a {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          padding: 20px;
          border: 1px #3b414e solid;
          margin: 10px;
          color: #b5bf82;
          text-decoration: none;
        }
        a:hover {
          background: #1A1B2A;
        }
      }
    </style>
  </head>
  <html>
  <body>
    <input id="filter" type="text" oninput="filter(event);" onkeydown="change_url_on_enter(event)"/>
    <hr>
    <div id="flex">
    </div>
    <hr>

    <script>
      let urls = [
        {
          "label": "beancount",
          "url": "http://localhost:5000"
        },
        {
          "label": "campo.fau",
          "url": "https://www.campo.fau.de/qisserver/pages/cs/sys/portal/hisinoneStartPage.faces"
        },
        {
          "label": "chomsky",
          "url": "https://chomsky.info/"
        },
        {
          "label": "consorsbank",
          "url": "https://www.consorsbank.de/home"
        },
        {
          "label": "currentaffairs",
          "url": "https://www.currentaffairs.org/"
        },
        {
          "label": "duck.ai",
          "url": "https://duckduckgo.com/?q=DuckDuckGo+AI+Chat&ia=chat&duckai=1"
        },
        {
          "label": "fritz",
          "url": "https://fritz.box/"
        },
        {
          "label": "fsi.cs.fau",
          "url": "https://fsi.cs.fau.de/"
        },
        {
          "label": "github",
          "url": "https://github.com/green-lad"
        },
        {
          "label": "home",
          "url": "http://greenlad.xyz/"
        },
        {
          "label": "homeassistant",
          "url": "http://homeassistant:8123/"
        },
        {
          "label": "leanpub",
          "url": "https://leanpub.com/"
        },
        {
          "label": "miniflux",
          "url": "https://localhost:8002"
        },
        {
          "label": "my.remarkable",
          "url": "https://my.remarkable.com/"
        },
        {
          "label": "papis",
          "url": "http://localhost:8888/library/papers/all"
        },
        {
          "label": "pocket_nc_simulator",
          "url": "https://sim.pentamachine.com/"
        },
        {
          "label": "pocketnc",
          "url": "http://192.168.178.55"
        },
        {
          "label": "radicale",
          "url": "http://localhost:5232"
        },
        {
          "label": "sparkasse",
          "url": "https://www.sparkasse-nuernberg.de/de/home.html"
        },
        {
          "label": "studon.fau",
          "url": "https://www.studon.fau.de/studon/ilias.php?baseClass=ilrepositorygui&reloadpublic=1&cmd=frameset&ref_id=1"
        },
        {
          "label": "vgn",
          "url": "https://www.vgn.de/"
        },
      ];

      let flex = document.getElementById("flex");
      for (const url of urls) {
        let a= document.createElement('a');
        let l = document.createTextNode(url.label);
        a.appendChild(l);
        a.title = url.label;
        a.href = url.url;
        flex.appendChild(a);
        url.element = a;
        url.matching = true;
      }
      let filterDom = document.getElementById("filter");
      filterDom.value = "";

      function change_url_on_enter(event) {
        if (event.key == "Enter") {
          for (const url of urls) {
            if (url.matching) {
              window.location.href = url.url;
            }
          }
        }
      }
      
      function filter(event) {
        let filter = new RegExp(filterDom.value, "i");
        for (const url of urls) {
          if (url.label.match(filter)) {
            url.matching = true;
            url.element.style.display = "inherit";
            url.element.style.visibility = "inherit";
          }
          else {
            url.matching = false;
            url.element.style.visibility = "hidden";
          }
        }
      }
    </script>
  </body>
</html>
